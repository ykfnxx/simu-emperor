name: CI
on:
  pull_request:
    branches: [next]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Record tested revisions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          echo "PR head: $PR_HEAD"
          echo "PR base: $PR_BASE"
      - run: npm ci
      - run: npm run typecheck
      - name: Deterministic tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=ci-results/vitest.xml
      - run: npm run build
      - name: Production entry and trace CLI
        run: |
          mkdir -p ci-results
          npm run test:smoke 2>&1 | tee ci-results/smoke.log
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - name: Test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            ci-results/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Static frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
